<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="AI detecting damage regions on a vehicle photo">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c16"/><stop offset="1" stop-color="#0e120d"/>
    </linearGradient>
    <linearGradient id="aiCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5742"/><stop offset="1" stop-color="#2b3427"/>
    </linearGradient>
  </defs>
  <rect width="560" height="400" fill="url(#aiBg)"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- scan grid -->
    <g stroke="rgba(167,227,74,.07)" stroke-width="1">
      <path d="M60 0v400M140 0v400M220 0v400M300 0v400M380 0v400M460 0v400"/>
      <path d="M0 70h560M0 150h560M0 230h560M0 310h560"/>
    </g>
    <!-- car body -->
    <path d="M96 268 q16 -62 58 -74 l30 -40 q66 -16 122 0 l34 44 q42 12 54 70 z" fill="url(#aiCar)" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
    <path d="M172 196 l22 -30 q54 -12 100 0 l24 30 z" fill="#0f1410" opacity=".85"/>
    <circle cx="150" cy="272" r="26" fill="#0b0d0a" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <circle cx="150" cy="272" r="10" fill="#1e241b"/>
    <circle cx="340" cy="272" r="26" fill="#0b0d0a" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <circle cx="340" cy="272" r="10" fill="#1e241b"/>
    <!-- crumple marks -->
    <path d="M226 214 l18 14 l-14 14 l20 12" fill="none" stroke="#e05c4a" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <path d="M300 236 l16 10 l-12 12" fill="none" stroke="#f0b429" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <!-- detection box: severe -->
    <rect x="200" y="188" width="86" height="74" fill="rgba(224,92,74,.12)" stroke="#e05c4a" stroke-width="2.5"/>
    <rect x="200" y="166" width="122" height="22" rx="3" fill="#e05c4a"/>
    <text x="208" y="181.5" fill="#150806" font-size="11.5" font-weight="800">Quarter panel · 0.93</text>
    <!-- detection box: moderate -->
    <rect x="290" y="222" width="72" height="54" fill="rgba(240,180,41,.1)" stroke="#f0b429" stroke-width="2.5"/>
    <rect x="290" y="200" width="100" height="22" rx="3" fill="#f0b429"/>
    <text x="298" y="215.5" fill="#161003" font-size="11.5" font-weight="800">Door skin · 0.71</text>
    <!-- sweep line -->
    <path d="M418 128 V300" stroke="#a7e34a" stroke-width="2.5" opacity=".8"/>
    <circle cx="418" cy="128" r="4" fill="#a7e34a"/>
    <!-- badge -->
    <rect x="40" y="40" width="150" height="30" rx="15" fill="rgba(167,227,74,.14)" stroke="#a7e34a" stroke-width="1.2"/>
    <circle cx="60" cy="55" r="5" fill="#a7e34a"/>
    <text x="74" y="59.5" fill="#a7e34a" font-size="12.5" font-weight="800">Gemini vision pass</text>
    <text x="40" y="356" fill="#c4cfc0" font-size="15" font-weight="700">2 damage regions detected</text>
    <text x="40" y="378" fill="#7a8a76" font-size="12.5">Structural review recommended</text>
  </g>
</svg>

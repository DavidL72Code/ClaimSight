<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="Adjuster reviewing and approving the AI assessment">
  <defs>
    <linearGradient id="hrBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c16"/><stop offset="1" stop-color="#0e120d"/>
    </linearGradient>
  </defs>
  <rect width="560" height="400" fill="url(#hrBg)"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- adjuster console -->
    <rect x="46" y="42" width="468" height="264" rx="14" fill="#12160f" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
    <path d="M46 78 H514" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
    <circle cx="66" cy="60" r="4.5" fill="#e05c4a" opacity=".8"/>
    <circle cx="82" cy="60" r="4.5" fill="#f0b429" opacity=".8"/>
    <circle cx="98" cy="60" r="4.5" fill="#a7e34a" opacity=".8"/>
    <text x="120" y="64.5" fill="#7a8a76" font-size="12.5" font-weight="700">Claim CS-4417 · adjuster review</text>

    <!-- avatar + assignee -->
    <circle cx="76" cy="106" r="17" fill="rgba(167,227,74,.16)" stroke="#a7e34a" stroke-width="1.3"/>
    <circle cx="76" cy="100" r="6" fill="#a7e34a"/>
    <path d="M65 116 q11 -11 22 0" fill="none" stroke="#a7e34a" stroke-width="2.4" stroke-linecap="round"/>
    <text x="104" y="102" fill="#e8efe6" font-size="14" font-weight="800">Assigned adjuster</text>
    <text x="104" y="120" fill="#7a8a76" font-size="12">Verifying AI findings against policy</text>

    <!-- checklist -->
    <g>
      <rect x="66" y="146" width="428" height="34" rx="8" fill="#191e15" stroke="rgba(255,255,255,.07)"/>
      <circle cx="88" cy="163" r="9" fill="#a7e34a"/>
      <path d="M84 163 l3.4 3.6 l6 -7" fill="none" stroke="#101408" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="168" fill="#c4cfc0" font-size="13" font-weight="650">Damage regions match photos</text>

      <rect x="66" y="188" width="428" height="34" rx="8" fill="#191e15" stroke="rgba(255,255,255,.07)"/>
      <circle cx="88" cy="205" r="9" fill="#a7e34a"/>
      <path d="M84 205 l3.4 3.6 l6 -7" fill="none" stroke="#101408" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="210" fill="#c4cfc0" font-size="13" font-weight="650">Valuation grounded in comparables</text>

      <rect x="66" y="230" width="428" height="34" rx="8" fill="#191e15" stroke="rgba(240,180,41,.28)"/>
      <circle cx="88" cy="247" r="9" fill="none" stroke="#f0b429" stroke-width="2.2"/>
      <path d="M88 242.5 v5 M88 251.5 v.5" stroke="#f0b429" stroke-width="2.2" stroke-linecap="round"/>
      <text x="108" y="252" fill="#c4cfc0" font-size="13" font-weight="650">Prior damage needs claimant confirmation</text>
    </g>

    <!-- actions -->
    <rect x="66" y="276" width="112" height="16" rx="8" fill="rgba(167,227,74,.9)"/>
    <text x="122" y="288" text-anchor="middle" fill="#101408" font-size="10.5" font-weight="800">APPROVE</text>
    <rect x="188" y="276" width="112" height="16" rx="8" fill="none" stroke="rgba(255,255,255,.2)"/>
    <text x="244" y="288" text-anchor="middle" fill="#c4cfc0" font-size="10.5" font-weight="800">REQUEST INFO</text>

    <text x="46" y="342" fill="#c4cfc0" font-size="15" font-weight="700">Human adjuster signs off</text>
    <text x="46" y="366" fill="#7a8a76" font-size="12.5">AI drafts the assessment — a person owns the decision</text>
  </g>
</svg>

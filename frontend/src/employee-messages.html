<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimSight | Employee Message Center</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght@400&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=ui-2" />
  </head>
  <body data-portal="employee" class="app-shell">
    <header class="topbar">
      <a class="brand" href="./employee-assessment.html">ClaimSight</a>
      <details class="employee-nav-menu">
        <summary class="employee-menu-button" aria-label="Open employee navigation">
          <span class="hamburger-lines" aria-hidden="true"></span>
          <span>Menu</span>
        </summary>
        <nav class="employee-menu-list" aria-label="Employee workflow navigation">
          <a href="./employee-assessment.html">Employee Assessment</a>
          <a href="./further-reasoning.html">Further Reasoning</a>
          <a class="active" href="./employee-messages.html">Message Center</a>
        </nav>
      </details>
      <div class="topbar-actions">
        <a class="employee-notification-bell icon-button" href="./employee-notifications.html" aria-label="Employee notifications">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span class="notification-count hidden">0</span>
      </a>
        <button class="logout-button" type="button" data-employee-logout>Logout</button>
      </div>
    </header>

    <main class="page employee-dashboard-page">
      <section class="consumer-dashboard-header">
        <div>
          <p class="kicker">Employee communications</p>
          <h1>Message center</h1>
        </div>
      </section>

      <section class="employee-messenger" aria-label="Employee case messages">
        <aside class="employee-thread-sidebar">
          <div class="employee-thread-head">
            <span>Disputes</span>
            <strong id="employee-thread-count">—</strong>
          </div>
          <div id="employee-thread-list"></div>
        </aside>

        <section class="employee-chat-panel">
          <header class="employee-chat-header">
            <div>
              <span>Case conversation</span>
              <strong id="message-case-id">—</strong>
            </div>
            <a id="message-case-link" class="text-action" href="./employee-assessment.html?claim=CLM-1048">View case</a>
          </header>

          <div id="employee-chat-history" class="employee-imessage-log" aria-live="polite"></div>

          <form id="employee-message-form" class="employee-imessage-compose">
            <input id="employee-message-input" type="text" placeholder="Message customer about this case..." aria-label="Message customer" />
            <label class="message-attach-button" aria-label="Attach files">
              <span class="material-symbols-outlined" aria-hidden="true">attach_file</span>
              <input id="employee-message-files" type="file" accept="image/*,.pdf,.doc,.docx" multiple />
            </label>
            <button type="submit" aria-label="Send message">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
            </button>
            <div id="employee-message-attachments" class="message-attachment-preview" aria-live="polite"></div>
          </form>
        </section>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./assets/vendor/supabase/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <script src="./supabase-client.js"></script>
    <script src="./data.js"></script>
    <script src="./attachments.js"></script>
    <script src="./employee-auth.js?v=supabase-1"></script>
    <script src="./employee-notifications.js"></script>
    <script src="./employee-messages.js"></script>
  </body>
</html>

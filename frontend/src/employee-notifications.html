<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimSight | Employee Notifications</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght@400&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=ui-2" />
  </head>
  <body data-portal="employee" class="app-shell">
    <header class="topbar">
      <a class="brand" href="./employee-assessment.html">ClaimSight</a>
      <details class="employee-nav-menu">
        <summary class="employee-menu-button" aria-label="Open employee navigation">
          <span class="hamburger-lines" aria-hidden="true"></span>
          <span>Menu</span>
        </summary>
        <nav class="employee-menu-list" aria-label="Employee workflow navigation">
          <a href="./employee-assessment.html">Employee Assessment</a>
          <a href="./further-reasoning.html">Further Reasoning</a>
          <a href="./employee-messages.html">Message Center</a>
        </nav>
      </details>
      <div class="topbar-actions">
        <a class="employee-notification-bell icon-button active" href="./employee-notifications.html" aria-label="Employee notifications">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span class="notification-count hidden">0</span>
      </a>
        <button class="logout-button" type="button" data-employee-logout>Logout</button>
      </div>
    </header>

    <main class="page employee-dashboard-page">
      <section class="consumer-dashboard-header">
        <div>
          <p class="kicker">Claimsight employee alerts</p>
          <h1>Notification center</h1>
        </div>
      </section>

      <section class="consumer-panel">
        <div class="consumer-panel-head">
          <span>Claim alerts</span>
        </div>
        <div class="employee-notification-list" aria-live="polite">
          <article class="employee-notification-empty"><strong>Loading alerts...</strong></article>
        </div>
      </section>
    </main>
    <script src="./assets/vendor/supabase/supabase.js"></script>
    <script src="./supabase-config.js?v=supabase-4"></script>
    <script src="./supabase-client.js?v=supabase-4"></script>
    <script src="./data.js?v=supabase-4"></script>
    <script src="./employee-auth.js?v=supabase-4"></script>
    <script src="./employee-notifications.js?v=supabase-4"></script>
  </body>
</html>

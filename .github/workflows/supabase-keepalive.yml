# Keeps the Supabase project from pausing.
#
# Supabase pauses free projects after about a week of inactivity, and
# restoring one is a manual click in their dashboard -- so a paused project
# means claim attachments stay broken until someone notices. This pings the
# project twice a week to keep it counted as active.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL and SUPABASE_ANON_KEY. The anon key is enough --
# this only needs to make a request, not read anything -- so the
# service_role key stays out of CI.

name: Supabase keepalive

on:
  schedule:
    # Monday and Thursday, 06:15 UTC. Twice a week leaves plenty of margin
    # inside a ~7 day pause window even if one run is skipped or delayed.
    - cron: "15 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set. Add them as repository secrets."
            exit 1
          fi

          base="${SUPABASE_URL%/}"
          failed=0

          ping() {
            path="$1"; expected="$2"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${base}${path}" || echo "000")

            if echo "${code}" | grep -qE "${expected}"; then
              echo "OK    ${path} -> ${code}"
            else
              echo "::error::${path} -> ${code} (expected ${expected})"
              failed=1
            fi
          }

          # PostgREST answers 200 with the OpenAPI spec for a valid anon key,
          # and 401 for a bad one -- so requiring 2xx here is what catches a
          # wrong or rotated key instead of quietly reporting success.
          ping "/rest/v1/" "^2[0-9][0-9]$"

          # Listing buckets needs the service role, so anon is legitimately
          # refused. 401/403 is the healthy answer; the request still reaches
          # the project, which is what keeps it from pausing.
          ping "/storage/v1/bucket" "^(2[0-9][0-9]|401|403)$"

          if [ "${failed}" -ne 0 ]; then
            echo "::error::Supabase keepalive failed. If the project is paused, restore it at https://supabase.com/dashboard"
          fi
          exit "${failed}"
